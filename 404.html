  document.querySelector('.theme').addEventListener('click', function () {
    var root = document.documentElement;
    var current =
      root.dataset.theme ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = current === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  // Phone menu. State lives in the masthead's data-menu attribute, which the
  // stylesheet only reads below the phone breakpoint.
  (function () {
    var head = document.querySelector('.masthead');
    var burger = head.querySelector('.hamburger');
    burger.hidden = false;
    head.dataset.menu = 'closed';

    function set(open) {
      head.dataset.menu = open ? 'open' : 'closed';
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    burger.addEventListener('click', function () {
      set(head.dataset.menu !== 'open');
    });
    // Close on an outside click or Escape.
    document.addEventListener('click', function (e) {
      if (head.dataset.menu === 'open' && !head.contains(e.target)) set(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') set(false);
    });
  })();

  // Show the button once the top marker is 400px out of view.
  (function () {
    var btn = document.querySelector('.to-top');
    var top = document.getElementById('top');
    if (!btn || !top || !('IntersectionObserver' in window)) return;
    btn.hidden = false;

    new IntersectionObserver(
      function (entries) {
        btn.classList.toggle('show', !entries[0].isIntersecting);
      },
      { rootMargin: '400px 0px 0px 0px' }
    ).observe(top);

    // A scripted scroll ignores CSS scroll-behavior, so check the
    // reduced-motion preference here.
    btn.addEventListener('click', function () {
      window.scrollTo({
        top: 0,
        behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
      });
    });
  })();
